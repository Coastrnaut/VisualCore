# VisualCore CI (feature 010 T-F912; FR-F910; feature 186 FR-U00-050). Fast host-only gates: docs, the steering
# validators of the unified app (steering documents, planning archive, planning index, migration ledger), compliance, dependency rules, script tests,
# public API, documented API, licenses, host Swift tests and an iOS Simulator build of the pure package. Rendering,
# reference and Release-symbol gates need the prebuilt ANGLE frameworks and run locally through scripts/release_check.py (see docs/index.md).
# Only the reference submodule is fetched, shallow and non-recursive (its license texts are inventoried); its
# ~12 GB nested ANGLE tree is never cloned.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    # Python validators only, so a Linux runner (UA-F10, owner request to speed CI up: macOS runners queue for long).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Reference submodule (shallow, non-recursive)
        run: git submodule update --init --depth 1 External/projectm-ios
      - name: Ledger and source archive
        run: python3 Tools/python/desktop_runbook.py validate
      - name: Docs
        run: python3 scripts/validate_docs.py
      # Feature 186 (UA-F00, FR-U00-050): the steering validators of the unified app. They read tracked files only.
      - name: Steering documents
        run: python3 scripts/validate_autocreator.py
      - name: Planning archive
        run: python3 scripts/planning_archive.py verify
      - name: Planning index
        run: python3 scripts/planning_index.py verify
      - name: Migration ledger
        run: python3 scripts/migration_ledger.py validate
      # Feature 187 (UA-F01): the committed runtime catalog is exactly what the build tool derives.
      - name: Runtime catalog
        run: python3 scripts/build_catalog.py --check
      - name: Compliance
        run: python3 scripts/check_compliance.py
      - name: Dependency rules
        run: python3 scripts/check_dependencies.py
      # Feature 196 (UA-F10): one shippable app, and experience packages that match the catalog.
      - name: App targets
        run: python3 scripts/check_app_targets.py
      - name: Experience packages
        run: python3 scripts/check_experience_packages.py
      - name: Public API
        run: python3 scripts/check_public_api.py
      - name: Documented API (all consumers)
        run: |
          python3 scripts/check_documented_api.py --sources Showcase/App
          python3 scripts/check_documented_api.py --sources Harnesses/InteractiveDemo
          python3 scripts/check_documented_api.py --sources Harnesses/SecondConsumer
      - name: Licenses
        run: python3 scripts/check_licenses.py
      - name: Usage descriptions (UA-F11)
        run: python3 scripts/check_usage_descriptions.py
      - name: Distinctiveness matrix (UA-F11)
        run: python3 scripts/check_distinctiveness.py --check
      - name: Script tests
        run: python3 scripts/test_scripts.py

  host-tests:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        id: toolchain
        run: |
          swift --version
          echo "xcode=$(xcodebuild -version | tr '\n' ' ' | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
      # Owner request of 2026-11-13 (UA-F10): cache build outputs. SwiftPM rebuilds only what changed; the key holds
      # the Xcode build and the manifests, and an older cache of the same toolchain is restored as a starting point.
      - name: SwiftPM build cache
        uses: actions/cache@v4
        with:
          path: |
            Packages/VisualCore/.build
            Harnesses/SecondConsumer/GardenKit/.build
          key: spm-host-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Packages/VisualCore/**/*.swift', 'Harnesses/SecondConsumer/GardenKit/**/*.swift') }}
          restore-keys: spm-host-${{ steps.toolchain.outputs.xcode }}-
      - name: VisualCore host tests
        run: swift test --package-path Packages/VisualCore
      - name: GardenKit host tests
        run: swift test --package-path Harnesses/SecondConsumer/GardenKit

  simulator-build:
    # US5/AC1: an iOS Simulator build of the pure VisualCore package (no ANGLE frameworks needed). Rendering, Showcase
    # and harness simulator tests need the locally built ANGLE frameworks and run in scripts/release_check.py.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Xcode
        id: toolchain
        run: |
          xcodebuild -version
          echo "xcode=$(xcodebuild -version | tr '\n' ' ' | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
      - name: DerivedData cache
        uses: actions/cache@v4
        with:
          path: Build/DerivedData
          key: dd-pure-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Packages/VisualCore/**/*.swift') }}
          restore-keys: dd-pure-${{ steps.toolchain.outputs.xcode }}-
      - name: Build VisualCore for the iOS Simulator
        run: >
          python3 scripts/xcodebuild_package.py --package Packages/VisualCore --scheme VisualCore-Package
          --destination generic-sim --action build

  app-build:
    # Feature 196 (UA-F10, FR-U10-001, FR-U10-002): compile the one app for the iOS Simulator in Debug (with its test
    # bundles) and in Release, unsigned. The ANGLE frameworks are built locally and never in Git, so this job links
    # against link-only stand-ins generated from the tracked EGL header (every function aborts; marker
    # vc_ci_angle_standin). The read-only reference submodule is checked out shallow and non-recursive for its
    # license texts; the stand-ins go into its gitignored Build/ folder, where the real frameworks are built locally,
    # and the reference-clean check proves afterwards that no tracked file of it changed. Nothing is run, signed or
    # published.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Reference submodule (shallow, non-recursive; license texts only)
        run: git submodule update --init --depth 1 External/projectm-ios
      - name: Xcode
        run: xcodebuild -version
      - name: Toolchain key
        id: toolchain
        run: echo "xcode=$(xcodebuild -version | tr '\n' ' ' | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
      - name: XcodeGen cache
        id: xcodegen-cache
        uses: actions/cache@v4
        with:
          path: ~/.ci-tools/xcodegen
          key: xcodegen-${{ runner.os }}-${{ runner.arch }}-brew-v1
      - name: XcodeGen (pin 2.46.0 in Configs/toolchain.json)
        # Homebrew's current XcodeGen, kept in the cache; a version other than the pin is reported, not hidden.
        run: |
          if [ ! -x ~/.ci-tools/xcodegen/bin/xcodegen ]; then
            brew install xcodegen
            mkdir -p ~/.ci-tools/xcodegen
            cp -R "$(brew --prefix xcodegen)/." ~/.ci-tools/xcodegen/
          fi
          echo "$HOME/.ci-tools/xcodegen/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.ci-tools/xcodegen/bin:$PATH"

          v=$(xcodegen --version | awk '{print $NF}')
          echo "XcodeGen $v"; [ "$v" = "2.46.0" ] || echo "::warning::XcodeGen $v differs from the pin 2.46.0"
      - name: ANGLE stand-in cache
        id: standin-cache
        uses: actions/cache@v4
        with:
          path: External/projectm-ios/Build/ANGLEFrameworks
          key: angle-standins-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Packages/VisualCoreRendering/Sources/CVisualCoreEGL/include/CVisualCoreEGL.h', 'scripts/make_ci_angle_standins.py') }}
      - name: ANGLE stand-ins (link only)
        if: steps.standin-cache.outputs.cache-hit != 'true'
        run: python3 scripts/make_ci_angle_standins.py --out External/projectm-ios/Build/ANGLEFrameworks
      - name: DerivedData cache
        uses: actions/cache@v4
        with:
          path: |
            Build/DerivedData/ci-debug
            Build/DerivedData/ci-release
          key: dd-app-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('project.yml', 'Packages/**/Package.swift', 'Packages/**/*.swift', 'Packages/**/*.c', 'Packages/**/*.h', 'Apps/VisualCore/**/*.swift') }}
          restore-keys: dd-app-${{ steps.toolchain.outputs.xcode }}-
      - name: Generate the project
        run: xcodegen generate --spec project.yml
      - name: Debug build with test bundles
        run: >
          xcodebuild build-for-testing -project VisualCore.xcodeproj -scheme VisualCore -configuration Debug
          -destination 'generic/platform=iOS Simulator' -derivedDataPath Build/DerivedData/ci-debug
          CODE_SIGNING_ALLOWED=NO
      - name: Release build
        run: >
          xcodebuild build -project VisualCore.xcodeproj -scheme VisualCore -configuration Release
          -destination 'generic/platform=iOS Simulator' -derivedDataPath Build/DerivedData/ci-release
          CODE_SIGNING_ALLOWED=NO
      - name: No advertising, analytics or tracking in the Release app (UA-F11)
        run: python3 scripts/check_no_tracking.py --app Build/DerivedData/ci-release/Build/Products/Release-iphonesimulator/VisualCore.app
      - name: Bundled licenses of the Release app (UA-F11)
        run: python3 scripts/check_licenses.py --app Build/DerivedData/ci-release/Build/Products/Release-iphonesimulator/VisualCore.app
      - name: Reference submodule unchanged
        run: python3 scripts/check_reference_clean.py
