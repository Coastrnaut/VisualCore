# InteractiveDemo — standalone VisualCore input/animation/particles demo (feature 006 T-F519; FR-F510).
# Harness only (not an App Store product): no ProjectM, unsigned simulator builds (CODE_SIGNING_ALLOWED=NO);
# device signing comes from the owner's gitignored Configs/Signing.local.xcconfig via Signing.xcconfig.
# Generate: xcodegen generate --spec Harnesses/InteractiveDemo/InteractiveDemo.yml
name: InteractiveDemo
options:
  bundleIdPrefix: dev.visualcore.harness
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: ../../Configs/Signing.xcconfig
  Release: ../../Configs/Signing.xcconfig
packages:
  VisualCore:
    path: ../../Packages/VisualCore
  VisualCoreRendering:
    path: ../../Packages/VisualCoreRendering
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  InteractiveDemo:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: VC Interactive Demo
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.harness.InteractiveDemo
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: VisualCore
        product: VisualCoreMath
      - package: VisualCore
        product: VisualCoreSimulation
      - package: VisualCore
        product: VisualCoreScenes
      - package: VisualCoreRendering
        product: VisualCoreRendering
  InteractiveDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    info:
      path: Generated/Tests-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.harness.InteractiveDemoTests
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: InteractiveDemo
  InteractiveDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    info:
      path: Generated/UITests-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.harness.InteractiveDemoUITests
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: InteractiveDemo
schemes:
  InteractiveDemo:
    build:
      targets:
        InteractiveDemo: all
        InteractiveDemoTests: [test]
        InteractiveDemoUITests: [test]
    test:
      targets: [InteractiveDemoTests, InteractiveDemoUITests]
