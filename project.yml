# project.yml — repository-root XcodeGen spec: the single source of truth for the unified app VisualCore (the only
# shippable application target, ADR-0009), the Showcase and the earlier standalone apps not yet adopted, which stay
# as consumers of the framework and are not shipped (feature 193 retires each after its move into
# Packages/ExperiencesCreative; A01, A02 and A03 are retired). XcodeGen 2.46.0. Generated VisualCore.xcodeproj is gitignored.
# Simulator/CI builds are unsigned (CODE_SIGNING_ALLOWED=NO); device signing comes only from the owner's
# gitignored Configs/Signing.local.xcconfig via Configs/Signing.xcconfig.
# The Showcase must never depend on ProjectM engine/preset/bridge modules (FR-F610; scripts/audit_showcase_dependencies.py).
name: VisualCore
options:
  bundleIdPrefix: dev.visualcore
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Configs/Signing.xcconfig
  Release: Configs/Signing.xcconfig
packages:
  VisualCore:
    path: Packages/VisualCore
  VisualCoreRendering:
    path: Packages/VisualCoreRendering
  # The creative experiences adopted from the standalone apps (feature 193, UA-F07; migration-plan.md section 2.1).
  ExperiencesCreative:
    path: Packages/ExperiencesCreative
  ParticleUniverseCore:
    path: Apps/ParticleUniverse/ParticleUniverseCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Showcase:
    type: application
    platform: iOS
    sources:
      - path: Showcase/App
      - path: Showcase/Shaders
        type: folder
        buildPhase: resources
      - path: Showcase/Resources
    info:
      path: Showcase/Generated/Info.plist
      properties:
        CFBundleDisplayName: VisualCore Showcase
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.Showcase
        PRODUCT_NAME: Showcase
        GENERATE_INFOPLIST_FILE: NO
        # The audit script reads the repository and the built app (outside the script sandbox).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # FR-F610: every Showcase build fails if it depends on a ProjectM engine/preset/bridge module (before any test runs).
      - name: Dependency audit (FR-F610)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" DEVELOPER_DIR="$DEVELOPER_DIR" \
            /usr/bin/python3 "$SRCROOT/scripts/audit_showcase_dependencies.py" --root "$SRCROOT" --app "$TARGET_BUILD_DIR/$WRAPPER_NAME"
    dependencies:
      - package: VisualCore
        product: VisualCoreMath
      - package: VisualCore
        product: VisualCoreSimulation
      - package: VisualCore
        product: VisualCoreScenes
      - package: VisualCore
        product: VisualCoreShaderSource
      - package: VisualCore
        product: VisualCoreEffectsGraph
      - package: VisualCore
        product: VisualCoreDiagnostics
      - package: VisualCoreRendering
        product: VisualCoreRendering
      - package: VisualCoreRendering
        product: VisualCoreEffects
      # Empty unless DEBUG || VISUALCORE_AUTOMATION (feature 010 T-F904; Release has zero automation symbols).
      - package: VisualCoreRendering
        product: VisualCoreAutomation
  ShowcaseTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Showcase/Tests/Unit]
    info:
      path: Showcase/Generated/ShowcaseTests-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.ShowcaseTests
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: Showcase
  ShowcaseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Showcase/Tests/UI]
    info:
      path: Showcase/Generated/ShowcaseUITests-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.ShowcaseUITests
        GENERATE_INFOPLIST_FILE: NO
        TEST_TARGET_NAME: Showcase
    dependencies:
      - target: Showcase
  ParticleUniverse:
    # A04 Particle Universe (feature 032 A04-P00): app shell; feature 033 (A04-P01) adds the seeded particle domain; the GPU loop arrives in Phase 02.
    type: application
    platform: iOS
    sources:
      - path: Apps/ParticleUniverse/App
    info:
      path: Apps/ParticleUniverse/Generated/Info.plist
      properties:
        CFBundleDisplayName: Particle Universe
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.ParticleUniverse
        PRODUCT_NAME: ParticleUniverse
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      # Feature 032 (A04-P00): accessible colors only; no render host yet.
      - package: VisualCoreRendering
        product: VisualCoreUI
      # Feature 033 (A04-P01): the GPU-free particle domain and the VisualCore simulation it builds on.
      - package: ParticleUniverseCore
        product: ParticleUniverseCore
      - package: VisualCore
        product: VisualCoreSimulation
      - package: VisualCore
        product: VisualCoreMath
      # Feature 034 (A04-P02): the GPU render loop (RenderHost, ParticleLayerScene) and quality tiers.
      - package: VisualCoreRendering
        product: VisualCoreRendering
      - package: VisualCore
        product: VisualCoreDiagnostics
      # Feature 035 (A04-P03): built-in palettes for the color gradients.
      - package: VisualCore
        product: VisualCoreParameters
    postBuildScripts:
      # FR-A04-006: the build fails if the app depends on ProjectM engine/preset/bridge modules.
      - name: Dependency audit (FR-A04-006)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" DEVELOPER_DIR="$DEVELOPER_DIR" \
            /usr/bin/python3 "$SRCROOT/scripts/audit_showcase_dependencies.py" --root "$SRCROOT" --spec project.yml \
            --target ParticleUniverse --sources Apps/ParticleUniverse --app "$TARGET_BUILD_DIR/$WRAPPER_NAME"
  ParticleUniverseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Apps/ParticleUniverse/Tests/UI]
    info:
      path: Apps/ParticleUniverse/Generated/UITests-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.ParticleUniverseUITests
        GENERATE_INFOPLIST_FILE: NO
        TEST_TARGET_NAME: ParticleUniverse
    dependencies:
      - target: ParticleUniverse
  VisualCore:
    # The unified app (feature 190, UA-F04; ADR-0009 D-01): the only shippable application target. Its Swift module is
    # VisualCoreApp, so that it cannot be confused with the framework package VisualCore.
    type: application
    platform: iOS
    sources:
      - path: Apps/VisualCore/App
      - path: Apps/VisualCore/Resources
      # The validated runtime catalog is bundled from the tracked Catalog folder; there is no copy in the app folder.
      - path: Catalog/experiences.json
        buildPhase: resources
      - path: Catalog/categories.json
        buildPhase: resources
    info:
      path: Apps/VisualCore/Generated/Info.plist
      properties:
        CFBundleDisplayName: VisualCore
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        # FR-A01-407, feature 193 FR-U07-020: the share sheet's "Save Image" uses Photos add-only access; the app
        # never calls PhotoKit itself.
        NSPhotoLibraryAddUsageDescription: Saves exported artwork to your photo library when you choose Save Image.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.VisualCore
        PRODUCT_NAME: VisualCore
        PRODUCT_MODULE_NAME: VisualCoreApp
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: VisualCore
        product: VisualCoreExperience
      - package: VisualCore
        product: VisualCoreSimulation
      # VisualCoreDiagnostics: the launch timing and the performance record of UA-F06.
      - package: VisualCore
        product: VisualCoreDiagnostics
      # VisualCorePersistence is used only by the debug experience (its core declares a migration chain); a package
      # product cannot be linked for one configuration only.
      - package: VisualCore
        product: VisualCorePersistence
      - package: VisualCoreRendering
        product: VisualCoreRendering
      - package: VisualCoreRendering
        product: VisualCoreUI
      - package: VisualCoreRendering
        product: VisualCoreExperienceHost
      # The adopted experiences before their X gate (feature 193): candidates of the registry.
      - package: ExperiencesCreative
        product: GenerativeArtStudioExperience
      - package: ExperiencesCreative
        product: FluidArtPlaygroundExperience
      - package: ExperiencesCreative
        product: FractalExplorerExperience
    postBuildScripts:
      - name: Bundle licenses (UA-F04)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" \
            /usr/bin/python3 "$SRCROOT/scripts/bundle_licenses.py" --out "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Licenses"
      - name: Dependency audit (UA-F04)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" DEVELOPER_DIR="$DEVELOPER_DIR" \
            /usr/bin/python3 "$SRCROOT/scripts/audit_showcase_dependencies.py" --root "$SRCROOT" --spec project.yml \
            --target VisualCore --sources Apps/VisualCore --app "$TARGET_BUILD_DIR/$WRAPPER_NAME"
  VisualCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Apps/VisualCore/Tests/Unit]
    info:
      path: Apps/VisualCore/Generated/Tests-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.VisualCoreTests
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: VisualCore
  VisualCoreUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Apps/VisualCore/Tests/UI]
    info:
      path: Apps/VisualCore/Generated/UITests-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.VisualCoreUITests
        GENERATE_INFOPLIST_FILE: NO
        TEST_TARGET_NAME: VisualCore
    dependencies:
      - target: VisualCore
schemes:
  VisualCore:
    build:
      targets:
        VisualCore: all
        VisualCoreTests: [test]
        VisualCoreUITests: [test]
    test:
      targets: [VisualCoreTests, VisualCoreUITests]
  Showcase:
    build:
      targets:
        Showcase: all
        ShowcaseTests: [test]
        ShowcaseUITests: [test]
    test:
      targets: [ShowcaseTests, ShowcaseUITests]
  ParticleUniverse:
    build:
      targets:
        ParticleUniverse: all
        ParticleUniverseUITests: [test]
    test:
      targets: [ParticleUniverseUITests]
