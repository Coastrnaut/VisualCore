# project.yml — repository-root XcodeGen spec (README §8: single source of truth for the Showcase and, later,
# all 25 app targets). XcodeGen 2.46.0. Generated VisualCore.xcodeproj is gitignored.
# Simulator/CI builds are unsigned (CODE_SIGNING_ALLOWED=NO); device signing comes only from the owner's
# gitignored Configs/Signing.local.xcconfig via Configs/Signing.xcconfig.
# The Showcase must never depend on ProjectM engine/preset/bridge modules (FR-F610; scripts/audit_showcase_dependencies.py).
name: VisualCore
options:
  bundleIdPrefix: dev.visualcore
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Configs/Signing.xcconfig
  Release: Configs/Signing.xcconfig
packages:
  VisualCore:
    path: Packages/VisualCore
  VisualCoreRendering:
    path: Packages/VisualCoreRendering
  GenerativeArtStudioCore:
    path: Apps/GenerativeArtStudio/Core
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Showcase:
    type: application
    platform: iOS
    sources:
      - path: Showcase/App
      - path: Showcase/Shaders
        type: folder
        buildPhase: resources
      - path: Showcase/Resources
    info:
      path: Showcase/Generated/Info.plist
      properties:
        CFBundleDisplayName: VisualCore Showcase
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.Showcase
        PRODUCT_NAME: Showcase
        GENERATE_INFOPLIST_FILE: NO
        # The audit script reads the repository and the built app (outside the script sandbox).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # FR-F610: every Showcase build fails if it depends on a ProjectM engine/preset/bridge module (before any test runs).
      - name: Dependency audit (FR-F610)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" DEVELOPER_DIR="$DEVELOPER_DIR" \
            /usr/bin/python3 "$SRCROOT/scripts/audit_showcase_dependencies.py" --root "$SRCROOT" --app "$TARGET_BUILD_DIR/$WRAPPER_NAME"
    dependencies:
      - package: VisualCore
        product: VisualCoreMath
      - package: VisualCore
        product: VisualCoreSimulation
      - package: VisualCore
        product: VisualCoreScenes
      - package: VisualCore
        product: VisualCoreShaderSource
      - package: VisualCore
        product: VisualCoreEffectsGraph
      - package: VisualCore
        product: VisualCoreDiagnostics
      - package: VisualCoreRendering
        product: VisualCoreRendering
      - package: VisualCoreRendering
        product: VisualCoreEffects
      # Empty unless DEBUG || VISUALCORE_AUTOMATION (feature 010 T-F904; Release has zero automation symbols).
      - package: VisualCoreRendering
        product: VisualCoreAutomation
  ShowcaseTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Showcase/Tests/Unit]
    info:
      path: Showcase/Generated/ShowcaseTests-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.ShowcaseTests
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: Showcase
  ShowcaseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Showcase/Tests/UI]
    info:
      path: Showcase/Generated/ShowcaseUITests-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.ShowcaseUITests
        GENERATE_INFOPLIST_FILE: NO
        TEST_TARGET_NAME: Showcase
    dependencies:
      - target: Showcase
  GenerativeArtStudio:
    # A01 Generative Art Studio (features 011–012): gallery and scene families on VisualCore.
    type: application
    platform: iOS
    sources:
      - path: Apps/GenerativeArtStudio/App
      - path: Apps/GenerativeArtStudio/Shaders
        type: folder
        buildPhase: resources
    info:
      path: Apps/GenerativeArtStudio/Generated/Info.plist
      properties:
        CFBundleDisplayName: Generative Art Studio
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.GenerativeArtStudio
        PRODUCT_NAME: GenerativeArtStudio
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # FR-A01-006: the build fails if the app depends on ProjectM engine/preset/bridge modules.
      - name: Dependency audit (FR-A01-006)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" DEVELOPER_DIR="$DEVELOPER_DIR" \
            /usr/bin/python3 "$SRCROOT/scripts/audit_showcase_dependencies.py" --root "$SRCROOT" --spec project.yml \
            --target GenerativeArtStudio --sources Apps/GenerativeArtStudio --app "$TARGET_BUILD_DIR/$WRAPPER_NAME"
    dependencies:
      - package: GenerativeArtStudioCore
        product: GenerativeArtStudioCore
      - package: VisualCore
        product: VisualCoreParameters
      - package: VisualCore
        product: VisualCoreSimulation
      - package: VisualCore
        product: VisualCoreMath
      - package: VisualCore
        product: VisualCoreScenes
      - package: VisualCoreRendering
        product: VisualCoreRendering
      - package: VisualCoreRendering
        product: VisualCoreUI
  GenerativeArtStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Apps/GenerativeArtStudio/Tests/Unit]
    info:
      path: Apps/GenerativeArtStudio/Generated/Tests-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.GenerativeArtStudioTests
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: GenerativeArtStudio
      - package: VisualCore
        product: VisualCoreTestSupport
  GenerativeArtStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Apps/GenerativeArtStudio/Tests/UI]
    info:
      path: Apps/GenerativeArtStudio/Generated/UITests-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.GenerativeArtStudioUITests
        GENERATE_INFOPLIST_FILE: NO
        TEST_TARGET_NAME: GenerativeArtStudio
    dependencies:
      - target: GenerativeArtStudio
schemes:
  Showcase:
    build:
      targets:
        Showcase: all
        ShowcaseTests: [test]
        ShowcaseUITests: [test]
    test:
      targets: [ShowcaseTests, ShowcaseUITests]
  GenerativeArtStudio:
    build:
      targets:
        GenerativeArtStudio: all
        GenerativeArtStudioTests: [test]
        GenerativeArtStudioUITests: [test]
    test:
      targets: [GenerativeArtStudioTests, GenerativeArtStudioUITests]
