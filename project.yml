# project.yml — repository-root XcodeGen spec: the single source of truth for the unified app VisualCore (the only
# shippable application target, ADR-0009), the Showcase and the four earlier standalone apps, which stay as
# consumers of the framework and are not shipped. XcodeGen 2.46.0. Generated VisualCore.xcodeproj is gitignored.
# Simulator/CI builds are unsigned (CODE_SIGNING_ALLOWED=NO); device signing comes only from the owner's
# gitignored Configs/Signing.local.xcconfig via Configs/Signing.xcconfig.
# The Showcase must never depend on ProjectM engine/preset/bridge modules (FR-F610; scripts/audit_showcase_dependencies.py).
name: VisualCore
options:
  bundleIdPrefix: dev.visualcore
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Configs/Signing.xcconfig
  Release: Configs/Signing.xcconfig
packages:
  VisualCore:
    path: Packages/VisualCore
  VisualCoreRendering:
    path: Packages/VisualCoreRendering
  GenerativeArtStudioCore:
    path: Apps/GenerativeArtStudio/Core
  # The pure adapter core of A01 (feature 193, UA-F07; research R1 and section 4).
  GenerativeArtStudioAdapter:
    path: Apps/GenerativeArtStudio/GenerativeArtStudioAdapter
  FluidArtPlaygroundCore:
    path: Apps/FluidArtPlayground/FluidArtPlaygroundCore
  # The pure adapter core of A02 (feature 193, UA-F07; research R1, R3).
  FluidArtPlaygroundAdapter:
    path: Apps/FluidArtPlayground/FluidArtPlaygroundAdapter
  FractalExplorerCore:
    path: Apps/FractalExplorer/FractalExplorerCore
  ParticleUniverseCore:
    path: Apps/ParticleUniverse/ParticleUniverseCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Showcase:
    type: application
    platform: iOS
    sources:
      - path: Showcase/App
      - path: Showcase/Shaders
        type: folder
        buildPhase: resources
      - path: Showcase/Resources
    info:
      path: Showcase/Generated/Info.plist
      properties:
        CFBundleDisplayName: VisualCore Showcase
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.Showcase
        PRODUCT_NAME: Showcase
        GENERATE_INFOPLIST_FILE: NO
        # The audit script reads the repository and the built app (outside the script sandbox).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # FR-F610: every Showcase build fails if it depends on a ProjectM engine/preset/bridge module (before any test runs).
      - name: Dependency audit (FR-F610)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" DEVELOPER_DIR="$DEVELOPER_DIR" \
            /usr/bin/python3 "$SRCROOT/scripts/audit_showcase_dependencies.py" --root "$SRCROOT" --app "$TARGET_BUILD_DIR/$WRAPPER_NAME"
    dependencies:
      - package: VisualCore
        product: VisualCoreMath
      - package: VisualCore
        product: VisualCoreSimulation
      - package: VisualCore
        product: VisualCoreScenes
      - package: VisualCore
        product: VisualCoreShaderSource
      - package: VisualCore
        product: VisualCoreEffectsGraph
      - package: VisualCore
        product: VisualCoreDiagnostics
      - package: VisualCoreRendering
        product: VisualCoreRendering
      - package: VisualCoreRendering
        product: VisualCoreEffects
      # Empty unless DEBUG || VISUALCORE_AUTOMATION (feature 010 T-F904; Release has zero automation symbols).
      - package: VisualCoreRendering
        product: VisualCoreAutomation
  ShowcaseTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Showcase/Tests/Unit]
    info:
      path: Showcase/Generated/ShowcaseTests-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.ShowcaseTests
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: Showcase
  ShowcaseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Showcase/Tests/UI]
    info:
      path: Showcase/Generated/ShowcaseUITests-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.ShowcaseUITests
        GENERATE_INFOPLIST_FILE: NO
        TEST_TARGET_NAME: Showcase
    dependencies:
      - target: Showcase
  GenerativeArtStudio:
    # A01 Generative Art Studio (features 011–012): gallery and scene families on VisualCore.
    type: application
    platform: iOS
    sources:
      - path: Apps/GenerativeArtStudio/App
      - path: Apps/GenerativeArtStudio/Shaders
        type: folder
        buildPhase: resources
      - path: Apps/GenerativeArtStudio/Resources
    info:
      path: Apps/GenerativeArtStudio/Generated/Info.plist
      properties:
        CFBundleDisplayName: Generative Art Studio
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        # FR-A01-407: the share sheet's "Save Image" uses Photos add-only access; the app never calls PhotoKit itself.
        NSPhotoLibraryAddUsageDescription: Saves exported artwork to your photo library when you choose Save Image.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.GenerativeArtStudio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: GenerativeArtStudio
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # T-A01-610: bundle the shipped components' license texts for the Acknowledgements screen (THIRD_PARTY_NOTICES.md).
      - name: Bundle licenses (T-A01-610)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" \
            /usr/bin/python3 "$SRCROOT/scripts/bundle_licenses.py" --out "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Licenses"
      # FR-A01-006: the build fails if the app depends on ProjectM engine/preset/bridge modules.
      - name: Dependency audit (FR-A01-006)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" DEVELOPER_DIR="$DEVELOPER_DIR" \
            /usr/bin/python3 "$SRCROOT/scripts/audit_showcase_dependencies.py" --root "$SRCROOT" --spec project.yml \
            --target GenerativeArtStudio --sources Apps/GenerativeArtStudio --app "$TARGET_BUILD_DIR/$WRAPPER_NAME"
    dependencies:
      - package: GenerativeArtStudioCore
        product: GenerativeArtStudioCore
      - package: VisualCore
        product: VisualCoreParameters
      - package: VisualCore
        product: VisualCoreSimulation
      - package: VisualCore
        product: VisualCoreMath
      - package: VisualCore
        product: VisualCoreScenes
      - package: VisualCore
        product: VisualCorePersistence
      - package: VisualCoreRendering
        product: VisualCoreRendering
      - package: VisualCoreRendering
        product: VisualCoreUI
      - package: VisualCoreRendering
        product: VisualCoreEffects
      - package: VisualCore
        product: VisualCoreEffectsGraph
      # Empty unless DEBUG || VISUALCORE_AUTOMATION (feature 017 T-A01-608; Release has zero automation symbols).
      - package: VisualCoreRendering
        product: VisualCoreAutomation
  GenerativeArtStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Apps/GenerativeArtStudio/Tests/Unit]
    info:
      path: Apps/GenerativeArtStudio/Generated/Tests-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.GenerativeArtStudioTests
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: GenerativeArtStudio
      - package: VisualCore
        product: VisualCoreTestSupport
  GenerativeArtStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Apps/GenerativeArtStudio/Tests/UI]
    info:
      path: Apps/GenerativeArtStudio/Generated/UITests-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.GenerativeArtStudioUITests
        GENERATE_INFOPLIST_FILE: NO
        TEST_TARGET_NAME: GenerativeArtStudio
    dependencies:
      - target: GenerativeArtStudio
  FluidArtPlayground:
    # A02 Fluid Art Playground (feature 018 A02-P00 shell; feature 019 A02-P01 fields, ping-pong and canvas).
    type: application
    platform: iOS
    sources:
      - path: Apps/FluidArtPlayground/App
      # Feature 024 T-A02-604/605: app icon (the app's own render) and the privacy manifest.
      - path: Apps/FluidArtPlayground/Resources
    info:
      path: Apps/FluidArtPlayground/Generated/Info.plist
      properties:
        CFBundleDisplayName: Fluid Art Playground
        NSPhotoLibraryAddUsageDescription: Fluid Art Playground saves your captured picture to Photos only when you choose Save Image.
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.FluidArtPlayground
        PRODUCT_NAME: FluidArtPlayground
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: FluidArtPlaygroundCore
        product: FluidArtPlaygroundCore
      - package: VisualCore
        product: VisualCorePersistence
      - package: VisualCore
        product: VisualCoreSimulation
      - package: VisualCore
        product: VisualCoreScenes
      - package: VisualCore
        product: VisualCoreDiagnostics
      - package: VisualCoreRendering
        product: VisualCoreRendering
      - package: VisualCoreRendering
        product: VisualCoreUI
      - package: VisualCoreRendering
        product: VisualCoreEffects
      - package: VisualCore
        product: VisualCoreEffectsGraph
      # Empty unless DEBUG || VISUALCORE_AUTOMATION (feature 023 T-A02-510; Release has zero automation symbols).
      - package: VisualCoreRendering
        product: VisualCoreAutomation
    postBuildScripts:
      # T-A02-606: bundle the shipped components' license texts for the Acknowledgements screen (as A01, T-A01-610).
      - name: Bundle licenses (T-A02-606)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" \
            /usr/bin/python3 "$SRCROOT/scripts/bundle_licenses.py" --out "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Licenses"
      # FR-A02-006: the build fails if the app depends on ProjectM engine/preset/bridge modules.
      - name: Dependency audit (FR-A02-006)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" DEVELOPER_DIR="$DEVELOPER_DIR" \
            /usr/bin/python3 "$SRCROOT/scripts/audit_showcase_dependencies.py" --root "$SRCROOT" --spec project.yml \
            --target FluidArtPlayground --sources Apps/FluidArtPlayground --app "$TARGET_BUILD_DIR/$WRAPPER_NAME"
  FluidArtPlaygroundTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Apps/FluidArtPlayground/Tests/Unit]
    info:
      path: Apps/FluidArtPlayground/Generated/Tests-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.FluidArtPlaygroundTests
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: FluidArtPlayground
      - package: VisualCore
        product: VisualCoreTestSupport
  FluidArtPlaygroundUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Apps/FluidArtPlayground/Tests/UI]
    info:
      path: Apps/FluidArtPlayground/Generated/UITests-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.FluidArtPlaygroundUITests
        GENERATE_INFOPLIST_FILE: NO
        TEST_TARGET_NAME: FluidArtPlayground
    dependencies:
      - target: FluidArtPlayground
  FractalExplorer:
    # A03 Fractal Explorer (feature 025 A03-P00): app shell; complex-plane domain and rendering arrive in Phases 01–02.
    type: application
    platform: iOS
    sources:
      - path: Apps/FractalExplorer/App
      # Feature 031 (A03-P06): privacy manifest and the app icon.
      - path: Apps/FractalExplorer/Resources
    info:
      path: Apps/FractalExplorer/Generated/Info.plist
      properties:
        CFBundleDisplayName: Fractal Explorer
        # Feature 029 (FR-A03-405): the share sheet's "Save Image" uses Photos add-only access; the app never calls PhotoKit.
        NSPhotoLibraryAddUsageDescription: Fractal Explorer saves your captured picture to Photos only when you choose Save Image.
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.FractalExplorer
        PRODUCT_NAME: FractalExplorer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      # Feature 026 (A03-P01): the GPU-free domain and the plane viewport; accessible colors.
      - package: FractalExplorerCore
        product: FractalExplorerCore
      - package: VisualCore
        product: VisualCoreMath
      - package: VisualCoreRendering
        product: VisualCoreUI
      # Feature 027 (A03-P02): GPU render, gestures, palette clock and palettes.
      - package: VisualCoreRendering
        product: VisualCoreRendering
      - package: VisualCore
        product: VisualCoreScenes
      - package: VisualCore
        product: VisualCoreSimulation
      - package: VisualCore
        product: VisualCoreParameters
      # Feature 028 (A03-P03): bookmarks on VisualCore NamedLibrary.
      - package: VisualCore
        product: VisualCorePersistence
      # Feature 030 (A03-P05): empty unless DEBUG || VISUALCORE_AUTOMATION (Release has zero automation symbols).
      - package: VisualCoreRendering
        product: VisualCoreAutomation
    postBuildScripts:
      # T-A03-604: bundle the shipped components' license texts for the Acknowledgements screen (as A01 and A02).
      - name: Bundle licenses (T-A03-604)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" \
            /usr/bin/python3 "$SRCROOT/scripts/bundle_licenses.py" --out "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Licenses"
      # FR-A03-006: the build fails if the app depends on ProjectM engine/preset/bridge modules.
      - name: Dependency audit (FR-A03-006)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" DEVELOPER_DIR="$DEVELOPER_DIR" \
            /usr/bin/python3 "$SRCROOT/scripts/audit_showcase_dependencies.py" --root "$SRCROOT" --spec project.yml \
            --target FractalExplorer --sources Apps/FractalExplorer --app "$TARGET_BUILD_DIR/$WRAPPER_NAME"
  FractalExplorerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Apps/FractalExplorer/Tests/Unit]
    info:
      path: Apps/FractalExplorer/Generated/Tests-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.FractalExplorerTests
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: FractalExplorer
      # Feature 031: image comparison for the icon provenance test.
      - package: VisualCore
        product: VisualCoreTestSupport
  FractalExplorerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Apps/FractalExplorer/Tests/UI]
    info:
      path: Apps/FractalExplorer/Generated/UITests-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.FractalExplorerUITests
        GENERATE_INFOPLIST_FILE: NO
        TEST_TARGET_NAME: FractalExplorer
    dependencies:
      - target: FractalExplorer
  ParticleUniverse:
    # A04 Particle Universe (feature 032 A04-P00): app shell; feature 033 (A04-P01) adds the seeded particle domain; the GPU loop arrives in Phase 02.
    type: application
    platform: iOS
    sources:
      - path: Apps/ParticleUniverse/App
    info:
      path: Apps/ParticleUniverse/Generated/Info.plist
      properties:
        CFBundleDisplayName: Particle Universe
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.ParticleUniverse
        PRODUCT_NAME: ParticleUniverse
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      # Feature 032 (A04-P00): accessible colors only; no render host yet.
      - package: VisualCoreRendering
        product: VisualCoreUI
      # Feature 033 (A04-P01): the GPU-free particle domain and the VisualCore simulation it builds on.
      - package: ParticleUniverseCore
        product: ParticleUniverseCore
      - package: VisualCore
        product: VisualCoreSimulation
      - package: VisualCore
        product: VisualCoreMath
      # Feature 034 (A04-P02): the GPU render loop (RenderHost, ParticleLayerScene) and quality tiers.
      - package: VisualCoreRendering
        product: VisualCoreRendering
      - package: VisualCore
        product: VisualCoreDiagnostics
      # Feature 035 (A04-P03): built-in palettes for the color gradients.
      - package: VisualCore
        product: VisualCoreParameters
    postBuildScripts:
      # FR-A04-006: the build fails if the app depends on ProjectM engine/preset/bridge modules.
      - name: Dependency audit (FR-A04-006)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" DEVELOPER_DIR="$DEVELOPER_DIR" \
            /usr/bin/python3 "$SRCROOT/scripts/audit_showcase_dependencies.py" --root "$SRCROOT" --spec project.yml \
            --target ParticleUniverse --sources Apps/ParticleUniverse --app "$TARGET_BUILD_DIR/$WRAPPER_NAME"
  ParticleUniverseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Apps/ParticleUniverse/Tests/UI]
    info:
      path: Apps/ParticleUniverse/Generated/UITests-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.ParticleUniverseUITests
        GENERATE_INFOPLIST_FILE: NO
        TEST_TARGET_NAME: ParticleUniverse
    dependencies:
      - target: ParticleUniverse
  VisualCore:
    # The unified app (feature 190, UA-F04; ADR-0009 D-01): the only shippable application target. Its Swift module is
    # VisualCoreApp, so that it cannot be confused with the framework package VisualCore.
    type: application
    platform: iOS
    sources:
      - path: Apps/VisualCore/App
      - path: Apps/VisualCore/Resources
      # The validated runtime catalog is bundled from the tracked Catalog folder; there is no copy in the app folder.
      - path: Catalog/experiences.json
        buildPhase: resources
      - path: Catalog/categories.json
        buildPhase: resources
      # The shaders of A01 Generative Art Studio (feature 193): its static framework has no bundle of its own.
      - path: Apps/GenerativeArtStudio/Shaders
        type: folder
        buildPhase: resources
    info:
      path: Apps/VisualCore/Generated/Info.plist
      properties:
        CFBundleDisplayName: VisualCore
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.VisualCore
        PRODUCT_NAME: VisualCore
        PRODUCT_MODULE_NAME: VisualCoreApp
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: VisualCore
        product: VisualCoreExperience
      - package: VisualCore
        product: VisualCoreSimulation
      # VisualCoreDiagnostics: the launch timing and the performance record of UA-F06.
      - package: VisualCore
        product: VisualCoreDiagnostics
      # VisualCorePersistence is used only by the debug experience (its core declares a migration chain); a package
      # product cannot be linked for one configuration only.
      - package: VisualCore
        product: VisualCorePersistence
      - package: VisualCoreRendering
        product: VisualCoreRendering
      - package: VisualCoreRendering
        product: VisualCoreUI
      - package: VisualCoreRendering
        product: VisualCoreExperienceHost
      # The adopted experiences before their X gate (feature 193): candidates of the registry.
      - target: GenerativeArtStudioExperience
      - package: GenerativeArtStudioAdapter
        product: GenerativeArtStudioAdapterCore
      - target: FluidArtPlaygroundExperience
      - package: FluidArtPlaygroundAdapter
        product: FluidArtPlaygroundAdapterCore
    postBuildScripts:
      - name: Bundle licenses (UA-F04)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" \
            /usr/bin/python3 "$SRCROOT/scripts/bundle_licenses.py" --out "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Licenses"
      - name: Dependency audit (UA-F04)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" DEVELOPER_DIR="$DEVELOPER_DIR" \
            /usr/bin/python3 "$SRCROOT/scripts/audit_showcase_dependencies.py" --root "$SRCROOT" --spec project.yml \
            --target VisualCore --sources Apps/VisualCore --app "$TARGET_BUILD_DIR/$WRAPPER_NAME"
  GenerativeArtStudioExperience:
    # A01 adopted as an experience of the one app (feature 193, UA-F07; research R1, data-model section 1): the
    # standalone app's sources without its @main and launch files, plus the adapter's presenter, controls and
    # factory. A static framework linked into the one app, never an application (one app target, one bundle id);
    # static, so that the Swift packages it shares with the app are linked once. Its shaders are copied by the app.
    type: framework.static
    platform: iOS
    sources:
      - path: Apps/GenerativeArtStudio/App
        excludes: [GenerativeArtStudioApp.swift, LaunchCleanup.swift, AppAutomation.swift]
      - path: Apps/GenerativeArtStudio/GenerativeArtStudioAdapter/Experience
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.VisualCore.GenerativeArtStudioExperience
        PRODUCT_NAME: GenerativeArtStudioExperience
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: GenerativeArtStudioCore
        product: GenerativeArtStudioCore
      - package: GenerativeArtStudioAdapter
        product: GenerativeArtStudioAdapterCore
      - package: VisualCore
        product: VisualCoreParameters
      - package: VisualCore
        product: VisualCoreSimulation
      - package: VisualCore
        product: VisualCoreMath
      - package: VisualCore
        product: VisualCoreScenes
      - package: VisualCore
        product: VisualCorePersistence
      - package: VisualCore
        product: VisualCoreEffectsGraph
      - package: VisualCore
        product: VisualCoreExperience
      - package: VisualCoreRendering
        product: VisualCoreRendering
      - package: VisualCoreRendering
        product: VisualCoreUI
      - package: VisualCoreRendering
        product: VisualCoreEffects
      - package: VisualCoreRendering
        product: VisualCoreExperienceHost
      - package: VisualCoreRendering
        product: VisualCoreAutomation
  GenerativeArtStudioExperienceTests:
    # The A01 adapter's session tests (feature 193 T-U07-011, T-U07-012), hosted by the one app.
    type: bundle.unit-test
    platform: iOS
    sources: [Apps/GenerativeArtStudio/GenerativeArtStudioAdapter/ExperienceTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.GenerativeArtStudioExperienceTests
        GENERATE_INFOPLIST_FILE: YES
    # No package products of its own: everything comes from the host app. Linking a package the app also links
    # makes Xcode build it as a dynamic framework, which breaks the link of VisualCoreTests (seen 2026-11-13).
    dependencies:
      - target: VisualCore
  FluidArtPlaygroundExperience:
    # A02 adopted as an experience of the one app (feature 193, UA-F07; research R1, R3; ADR-0011): the standalone
    # app's sources without its @main, automation and test-mode files, plus the adapter's presenter, controls and
    # factory. A static framework linked into the one app, as A01's.
    type: framework.static
    platform: iOS
    sources:
      - path: Apps/FluidArtPlayground/App
        excludes: [FluidArtPlaygroundApp.swift, AppAutomation.swift, TestMode.swift]
      - path: Apps/FluidArtPlayground/FluidArtPlaygroundAdapter/Experience
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.VisualCore.FluidArtPlaygroundExperience
        PRODUCT_NAME: FluidArtPlaygroundExperience
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: FluidArtPlaygroundCore
        product: FluidArtPlaygroundCore
      - package: FluidArtPlaygroundAdapter
        product: FluidArtPlaygroundAdapterCore
      - package: VisualCore
        product: VisualCorePersistence
      - package: VisualCore
        product: VisualCoreSimulation
      - package: VisualCore
        product: VisualCoreScenes
      - package: VisualCore
        product: VisualCoreMath
      - package: VisualCore
        product: VisualCoreDiagnostics
      - package: VisualCore
        product: VisualCoreEffectsGraph
      - package: VisualCore
        product: VisualCoreExperience
      - package: VisualCoreRendering
        product: VisualCoreRendering
      - package: VisualCoreRendering
        product: VisualCoreUI
      - package: VisualCoreRendering
        product: VisualCoreEffects
      - package: VisualCoreRendering
        product: VisualCoreExperienceHost
      - package: VisualCoreRendering
        product: VisualCoreAutomation
  FluidArtPlaygroundExperienceTests:
    # The A02 adapter's session and parity tests (feature 193 T-U07-021), hosted by the one app. No package
    # products of its own (see GenerativeArtStudioExperienceTests).
    type: bundle.unit-test
    platform: iOS
    sources: [Apps/FluidArtPlayground/FluidArtPlaygroundAdapter/ExperienceTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.FluidArtPlaygroundExperienceTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VisualCore
  VisualCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Apps/VisualCore/Tests/Unit]
    info:
      path: Apps/VisualCore/Generated/Tests-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.VisualCoreTests
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: VisualCore
  VisualCoreUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Apps/VisualCore/Tests/UI]
    info:
      path: Apps/VisualCore/Generated/UITests-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.visualcore.VisualCoreUITests
        GENERATE_INFOPLIST_FILE: NO
        TEST_TARGET_NAME: VisualCore
    dependencies:
      - target: VisualCore
schemes:
  VisualCore:
    build:
      targets:
        VisualCore: all
        VisualCoreTests: [test]
        VisualCoreUITests: [test]
        GenerativeArtStudioExperienceTests: [test]
        FluidArtPlaygroundExperienceTests: [test]
    test:
      targets: [VisualCoreTests, VisualCoreUITests, GenerativeArtStudioExperienceTests, FluidArtPlaygroundExperienceTests]
  Showcase:
    build:
      targets:
        Showcase: all
        ShowcaseTests: [test]
        ShowcaseUITests: [test]
    test:
      targets: [ShowcaseTests, ShowcaseUITests]
  GenerativeArtStudio:
    build:
      targets:
        GenerativeArtStudio: all
        GenerativeArtStudioTests: [test]
        GenerativeArtStudioUITests: [test]
    test:
      targets: [GenerativeArtStudioTests, GenerativeArtStudioUITests]
  FluidArtPlayground:
    build:
      targets:
        FluidArtPlayground: all
        FluidArtPlaygroundTests: [test]
        FluidArtPlaygroundUITests: [test]
    test:
      targets: [FluidArtPlaygroundTests, FluidArtPlaygroundUITests]
  FractalExplorer:
    build:
      targets:
        FractalExplorer: all
        FractalExplorerTests: [test]
        FractalExplorerUITests: [test]
    test:
      targets: [FractalExplorerTests, FractalExplorerUITests]
  ParticleUniverse:
    build:
      targets:
        ParticleUniverse: all
        ParticleUniverseUITests: [test]
    test:
      targets: [ParticleUniverseUITests]
